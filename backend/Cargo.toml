[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.131.0"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
lambda_http = "1.3.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
